name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint-test:
    name: fmt · clippy · test · loc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy (-D warnings)
        run: cargo clippy --workspace --all-targets --exclude gw2lurker-addon -- -D warnings

      # El crate `addon` depende del crate `windows` y no compila fuera de Windows;
      # su lint y sus tests se ejecutan en el job de Windows.
      - name: cargo test
        run: cargo test --workspace --exclude gw2lurker-addon

      # RNF-10: ningún fichero .rs por encima de 800 líneas.
      - name: check_loc.sh
        run: bash ./scripts/check_loc.sh

      # T-03b: un test no puede citar un requisito que no existe.
      - name: check_traceability.sh
        run: bash ./scripts/check_traceability.sh

  supply-chain:
    name: deny · audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Licencias, bans, fuentes y avisos según `deny.toml`.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

      # `cargo-audit` viene precompilado: compilarlo aquí costaba ~5 min por ejecución.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: cargo audit
        run: cargo audit

  build-windows:
    name: release msvc · tamaño
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - name: cargo build --release
        run: cargo build --release -p gw2lurker-addon

      - name: cargo clippy (addon)
        run: cargo clippy -p gw2lurker-addon --all-targets -- -D warnings

      - name: cargo test (addon)
        run: cargo test -p gw2lurker-addon

      # RNF-09 / ADR-013: objetivo 2.2 MB, límite 2.5 MB.
      - name: check_size.sh
        shell: bash
        run: ./scripts/check_size.sh target/release/gw2_lurker.dll
