name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint-test:
    name: fmt · clippy · test · loc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy (-D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      # RNF-10: ningún fichero .rs por encima de 800 líneas.
      - name: check_loc.sh
        run: bash ./scripts/check_loc.sh

  supply-chain:
    name: deny · audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Licencias, bans, fuentes y avisos según `deny.toml`.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    name: release msvc · tamaño
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - name: cargo build --release (x86_64-pc-windows-msvc)
        run: cargo build --release --target x86_64-pc-windows-msvc -p gw2lurker-addon

      # RNF-09 / ADR-008: objetivo 1.5 MB, límite 2.5 MB.
      - name: check_size.sh
        shell: bash
        run: ./scripts/check_size.sh target/x86_64-pc-windows-msvc/release/gw2lurker_addon.dll
