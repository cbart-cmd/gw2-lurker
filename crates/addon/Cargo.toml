[package]
name = "gw2lurker-addon"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true

[lib]
name = "gw2_lurker"
crate-type = ["cdylib"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "serde", "clock"] }
gw2lurker-api = { path = "../api", version = "0.20.1" }
gw2lurker-core = { path = "../core", version = "0.20.1" }
gw2lurker-store = { path = "../store", version = "0.20.1" }
log = "0.4"
nexus = { git = "https://github.com/zerthox/nexus-rs", tag = "0.12.0", version = "0.12.0", features = [
    "arc",
    "extras",
    "log",
    "log_filter",
    "mumble",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
