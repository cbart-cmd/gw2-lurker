[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.25.1"
edition = "2021"
rust-version = "1.87.0"
license = "GPL-3.0-only"
authors = ["cbart-cmd"]
repository = "https://github.com/cbart-cmd/gw2-lurker"

[workspace.lints.rust]
missing_debug_implementations = "warn"
unused_qualifications = "warn"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "unwind"
debug = false
