[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# GPL-3.0-only: licencia del propio proyecto (ver LICENSE).
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "CC0-1.0", "MPL-2.0", "GPL-3.0-only", "GPL-3.0-or-later"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Dependencias de `nexus-rs`: su workspace usa git para los bindings de Mumble y arcdps.
allow-git = [
    "https://github.com/zerthox/nexus-rs",
    "https://github.com/zerthox/gw2-mumble-rs",
    "https://github.com/zerthox/arcdps-rs",
]
